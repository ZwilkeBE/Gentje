<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POGO GENT — Trade Strings</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #f4f5f7; 
      padding: 20px; 
      color: #333; 
      margin: 0;
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
    }
    h2 {
      text-align: center;
      color: #111;
      margin-bottom: 15px;
    }
    .top-info { 
      background: #e53e3e; 
      color: white; 
      padding: 14px; 
      border-radius: 10px; 
      font-weight: bold; 
      text-align: center; 
      margin-bottom: 25px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .player-card { 
      background: #ffffff; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 25px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); 
      border: 1px solid #e2e8f0;
    }
    .player-name { 
      font-size: 1.5rem; 
      color: #1a202c; 
      border-bottom: 2px solid #edf2f7; 
      padding-bottom: 8px; 
      margin-top: 0; 
      margin-bottom: 15px; 
    }
    .category-title { 
      font-size: 1.15rem; 
      color: #2d3748; 
      margin-top: 20px; 
      margin-bottom: 8px; 
      font-weight: 700; 
      display: block;
    }
    .string-box { 
      background: #f8fafc; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      padding: 12px; 
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; 
      font-size: 0.85rem; 
      word-break: break-all; 
      max-height: 120px; 
      overflow-y: auto; 
      color: #334155;
    }
    .copy-btn { 
      margin-top: 8px; 
      margin-bottom: 12px;
      background: #3182ce; 
      color: white; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.85rem; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      transition: background 0.2s;
    }
    .copy-btn:hover { 
      background: #2b6cb0; 
    }
    .copy-btn:active { 
      transform: scale(0.98); 
    }
  </style>
</head>
<body>

<div class="container">
  <h2>POGO GENT — Trade Strings</h2>
  <div id="top-info" class="top-info">Gegevens laden uit Google Sheets...</div>
  <div id="strings-container">Lijst wordt opgebouwd...</div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQdTzAM79CJAe8nc83RkwIpIbXV-dPu_DIlh1r0ApoNHddkZr57WuFoyoOQPqMs0kE2wtPwQFSuDt2C/pub?gid=82013888&single=true&output=csv';

  async function loadStrings() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      
      const rows = parseCSVLines(data);
      const container = document.getElementById('strings-container');
      const topInfo = document.getElementById('top-info');
      container.innerHTML = '';

      // Eerste regel: Random info
      if (rows.length > 0 && rows[0]) {
        topInfo.innerText = rows[0];
      }

      let currentCard = null;

      for (let i = 1; i < rows.length; i++) {
        let text = rows[i] ? rows[i].trim() : '';
        if (!text) continue;

        // Bepaal of deze regel een zoekstring is (bevat &, !, of bestaat voornamelijk uit getallen en komma's)
        const isString = text.includes('&') || text.includes('!') || /^[\d,\s]+$/.test(text);

        if (isString && currentCard) {
          // VOEG ZOEKSTRING TOE AAN HUIDIGE SPELER
          const uniqueId = 'string-' + i;
          
          const stringBox = document.createElement('div');
          stringBox.className = 'string-box';
          stringBox.id = uniqueId;
          stringBox.innerText = text;

          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.innerHTML = '📋 Kopieer string';
          copyBtn.onclick = () => copyToClipboard(uniqueId, copyBtn);

          currentCard.appendChild(stringBox);
          currentCard.appendChild(copyBtn);
        } else {
          // HET IS EEN KOP (Categorie OF Spelersnaam)
          const hasCategoryCode = /\(C\d+\)/i.test(text);
          const isCategoryWord = text.toLowerCase().includes('tradelijst') || 
                                 text.toLowerCase().includes('lucky') || 
                                 text.toLowerCase().includes('special') || 
                                 text.toLowerCase().includes('legendary');

          if ((hasCategoryCode || isCategoryWord) && currentCard) {
            // HET IS EEN CATEGORIE: Maak de titel schoon door de (C1/C4/C7) te verwijderen
            let cleanCategory = text.replace(/\s*\(C\d+\)/gi, '').replace(/\s*\(.*?\)/g, '').trim();

            const catHeader = document.createElement('h4');
            catHeader.className = 'category-title';
            catHeader.innerText = cleanCategory;
            currentCard.appendChild(catHeader);
          } else {
            // HET IS EEN NIEUWE SPELER: Maak een nieuwe kaart aan
            currentCard = document.createElement('div');
            currentCard.className = 'player-card';
            
            const playerTitle = document.createElement('h3');
            playerTitle.className = 'player-name';
            playerTitle.innerText = text;
            currentCard.appendChild(playerTitle);
            
            container.appendChild(currentCard);
          }
        }
      }
    } catch (err) {
      console.error(err);
      document.getElementById('strings-container').innerHTML = 'Er is een fout opgetreden bij het laden van de gegevens.';
    }
  }

  // Betrouwbare CSV-regel lezer
  function parseCSVLines(csvText) {
    const lines = csvText.split(/\r?\n/);
    return lines.map(line => {
      let trimmed = line.trim();
      if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
        trimmed = trimmed.substring(1, trimmed.length - 1).replace(/""/g, '"');
      }
      return trimmed;
    });
  }

  function copyToClipboard(elementId, btnElement) {
    const text = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(text).then(() => {
      const originalText = btnElement.innerHTML;
      btnElement.innerHTML = '✅ Gekopieerd!';
      btnElement.style.background = '#38a169';
      
      setTimeout(() => {
        btnElement.innerHTML = originalText;
        btnElement.style.background = '#3182ce';
      }, 2000);
    });
  }

  loadStrings();
</script>

</body>
</html>
