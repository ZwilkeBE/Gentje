<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POGO GENT - Search Strings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    .player-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .player-name { font-size: 1.4rem; font-weight: bold; margin-top: 0; color: #111; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .section-title { font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #555; font-size: 0.95rem; }
    .string-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; word-break: break-all; position: relative; max-height: 100px; overflow-y: auto; }
    .copy-btn { margin-top: 8px; background: #007aff; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; }
    .copy-btn:active { background: #0056b3; }
    .top-info { background: #d9534f; color: white; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 20px; }
 .player-card {
  background: #ffffff;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.player-name {
  font-size: 1.5rem;
  color: #1a1a1a;
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 8px;
  margin-top: 0;
  margin-bottom: 15px;
}

.category-title {
  font-size: 1.1rem;
  color: #4a5568;
  margin-top: 20px;
  margin-bottom: 8px;
  font-weight: 600;
}
  </style>
</head>
<body>

<div class="container">
  <h2>POGO GENT — Trade Strings</h2>
  <div id="top-info" class="top-info">Laden...</div>
  <div id="strings-container">Lijst wordt geladen...</div>
</div>

<script>
  // 1. DOWNSCALE/PUBLICATIE LINK VAN JE GOOGLE SHEET CSV:
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQdTzAM79CJAe8nc83RkwIpIbXV-dPu_DIlh1r0ApoNHddkZr57WuFoyoOQPqMs0kE2wtPwQFSuDt2C/pub?gid=82013888&single=true&output=csv';

  async function loadStrings() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      
      const rows = parseCSV(data);
      const container = document.getElementById('strings-container');
      const topInfo = document.getElementById('top-info');
      container.innerHTML = '';

      // Eerste regel: Random info
      if (rows[0] && rows[0][0]) {
        topInfo.innerText = rows[0][0];
      }

      let currentCard = null;

      for (let i = 1; i < rows.length; i++) {
        let text = rows[i][0] ? rows[i][0].trim() : '';
        if (!text) continue;

        const isString = text.includes('&') || text.includes('!');

        if (!isString) {
          // Check of het een categorie is (bijv. bevat "C1", "C4", "C7" of "Tradelijst") 
          // OF dat het de naam van een nieuwe speler is.
          const isCategory = text.toLowerCase().includes('c1') || 
                             text.toLowerCase().includes('c4') || 
                             text.toLowerCase().includes('c7') || 
                             text.toLowerCase().includes('lijst') ||
                             text.toLowerCase().includes('lucky');

          if (isCategory && currentCard) {
            // Voeg een tussenkop (categorie) toe in de BESTAANDE spelerskaart
            const catHeader = document.createElement('h4');
            catHeader.className = 'category-title';
            catHeader.innerText = text;
            currentCard.appendChild(catHeader);
          } else {
            // Dit is een NIEUWE SPELER -> Maak 1 grote speler-kaart aan!
            currentCard = document.createElement('div');
            currentCard.className = 'player-card';
            
            const playerTitle = document.createElement('h3');
            playerTitle.className = 'player-name';
            playerTitle.innerText = text;
            currentCard.appendChild(playerTitle);
            
            container.appendChild(currentCard);
          }
        } else if (currentCard) {
          // Voeg de zoekstring + kopieerknop toe aan de speler-kaart
          const uniqueId = 'string-' + i;
          
          const stringBox = document.createElement('div');
          stringBox.className = 'string-box';
          stringBox.id = uniqueId;
          stringBox.innerText = text;

          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.innerHTML = '📋 Kopieer string';
          copyBtn.onclick = () => copyToClipboard(uniqueId);

          currentCard.appendChild(stringBox);
          currentCard.appendChild(copyBtn);
        }
      }
    } catch (err) {
      console.error(err);
      document.getElementById('strings-container').innerHTML = 'Er is een fout opgetreden bij het laden van de gegevens.';
    }
  }

  // CSV Parser die rekening houdt met komma's en aanhalingstekens
  function parseCSV(text) {
    let lines = text.split('\n');
    return lines.map(line => {
      let match = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if (!match) return [line.replace(/^"|"$/g, '')];
      return match.map(m => m.replace(/^"|"$/g, ''));
    });
  }

  function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('String gekopieerd naar klembord!');
    });
  }

  loadStrings();
</script>

</body>
</html>
