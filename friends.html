<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Codes - POGO Gent</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #2b3a4a;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
    }

    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
    }

    .btn-add {
      display: inline-block;
      padding: 10px 18px;
      background: var(--primary-color);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: #1e293b;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    th {
      background-color: #f8fafc;
      color: var(--primary-color);
      font-weight: 700;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: white;
    }

    .badge-valor { background-color: #ef4444; }
    .badge-mystic { background-color: #3b82f6; }
    .badge-instinct { background-color: #eab308; color: #000; }
    .badge-default { background-color: #64748b; }

    .copy-btn {
      cursor: pointer;
      background: #e2e8f0;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-left: 6px;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #cbd5e1;
    }

    #loading, #empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header-flex">
        <div>
          <h1>PoGoGent Friend Codes</h1>
          <p style="color: #666; font-size: 0.9rem;">Vind en voeg trainers uit de regio Gent toe!</p>
        </div>
        <a href="/" class="btn-add">+ Mijn Code Toevoegen</a>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Zoek op naam, stad, team of Discord naam...">
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Trainer Naam</th>
              <th>Team</th>
              <th>Trainer Code</th>
              <th>Stad / Regio</th>
              <th>Discord Naam</th>
              <th>Lucky Eggs</th>
              <th>Opener / Sender</th>
            </tr>
          </thead>
          <tbody id="trainersTableBody">
            <!-- Data wordt dynamisch ingeladen -->
          </tbody>
        </table>
        <div id="loading">Gegevens laden uit Supabase...</div>
        <div id="empty" style="display: none;">Geen trainers gevonden.</div>
      </div>
    </div>
  </div>

  <script>
    // Supabase gegevens:
    const SUPABASE_URL = 'https://jgvouztircuqhrisisdd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ecKa4O0QKRkcHdpkEVl8rg_T6jEn5MZ';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allTrainers = [];

    // Formatteer 12 cijfers met spaties (bijv. 1234 5678 9012)
    function formatCode(code) {
      if (!code) return '';
      const clean = code.replace(/\D/g, '');
      return clean.replace(/(\d{4})(\d{4})(\d{4})/, '$1 $2 $3');
    }

    // Kopieer-functie voor trainer code
    function copyCode(code, btn) {
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.innerText;
        btn.innerText = 'Gekopieerd!';
        btn.style.background = '#86efac';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = '#e2e8f0';
        }, 1500);
      });
    }

    // Team badge helper
    function getTeamBadge(team) {
      if (!team) return '<span class="badge badge-default">Onbekend</span>';
      const t = team.toLowerCase();
      if (t.includes('valor')) return '<span class="badge badge-valor">Valor</span>';
      if (t.includes('mystic')) return '<span class="badge badge-mystic">Mystic</span>';
      if (t.includes('instinct')) return '<span class="badge badge-instinct">Instinct</span>';
      return `<span class="badge badge-default">${team}</span>`;
    }

    // Tabel renderen
    function renderTable(trainers) {
      const tbody = document.getElementById('trainersTableBody');
      const emptyDiv = document.getElementById('empty');
      tbody.innerHTML = '';

      if (trainers.length === 0) {
        emptyDiv.style.display = 'block';
        return;
      }
      emptyDiv.style.display = 'none';

      trainers.forEach(t => {
        const tr = document.createElement('tr');

        const formattedCode = formatCode(t.trainer_code || '');

        tr.innerHTML = `
          <td><strong>${t.trainer_name || '-'}</strong></td>
          <td>${getTeamBadge(t.team)}</td>
          <td>
            <code>${formattedCode}</code>
            <button class="copy-btn" onclick="copyCode('${t.trainer_code}', this)">Kopieer</button>
          </td>
          <td>${t.location || '-'}</td>
          <td>${t.discord_name || '-'}</td>
          <td>${t.lucky_eggs || '-'}</td>
          <td>${t.player_type || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Data ophalen uit Supabase
    async function loadTrainers() {
      const loadingDiv = document.getElementById('loading');

      const { data, error } = await _supabase
        .from('trainers')
        .select('*')
        .order('id', { ascending: false });

      loadingDiv.style.display = 'none';

      if (error) {
        console.error('Fout bij ophalen:', error);
        loadingDiv.innerText = 'Fout bij het laden van de gegevens.';
        loadingDiv.style.display = 'block';
        return;
      }

      allTrainers = data || [];
      renderTable(allTrainers);
    }

    // Zoekbalk functionaliteit
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allTrainers.filter(t => 
        (t.trainer_name && t.trainer_name.toLowerCase().includes(term)) ||
        (t.location && t.location.toLowerCase().includes(term)) ||
        (t.team && t.team.toLowerCase().includes(term)) ||
        (t.discord_name && t.discord_name.toLowerCase().includes(term)) ||
        (t.trainer_code && t.trainer_code.includes(term))
      );
      renderTable(filtered);
    });

    // Starten bij pagina-load
    loadTrainers();
  </script>
</body>
</html>
