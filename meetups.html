<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POGO GENT – Meetup Overzicht Citadelpark / S.M.A.K.</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --badge-low: #1e3a8a;
      --badge-med: #854d0e;
      --badge-high: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button, select, input {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    input[type="checkbox"] {
      padding: 0;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    button.primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    button.primary:hover {
      opacity: 0.9;
    }

    .filters {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters input[type="text"] {
      flex: 1;
      min-width: 220px;
    }

    .toggle-past {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    th, td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-low { background: var(--badge-low); color: #bfdbfe; }
    .badge-med { background: var(--badge-med); color: #fef08a; }
    .badge-high { background: var(--badge-high); color: #fecaca; }
    .badge-default { background: #334155; color: #e2e8f0; }

    .photo-time {
      font-weight: 700;
      color: var(--accent);
    }

    .status {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .actions, .filters { display: none; }
      .table-wrap { border: 1px solid #ccc; }
      th { background: #f1f5f9; color: #000; }
      td { border-color: #ddd; color: #000; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>POGO GENT – Meetup Overzicht (S.M.A.K. / Citadelpark)</h1>
        <p class="subtitle">Verzamellocatie: Plein voor S.M.A.K. (Jan Hoetplein, Gent)</p>
      </div>
      <div class="actions">
        <button onclick="window.print()">Afdrukken / PDF</button>
        <button class="primary" onclick="downloadCSV()">Download CSV</button>
      </div>
    </header>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Zoek op datum of event..." oninput="renderTable()" />
      <select id="typeFilter" onchange="renderTable()">
        <option value="">Alle event-types</option>
      </select>
      <label class="toggle-past">
        <input type="checkbox" id="showPast" onchange="renderTable()" />
        Toon voorbije meetups
      </label>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Datum</th>
            <th>Uren</th>
            <th>Type Event</th>
            <th>Event</th>
            <th>Verwachte opkomst</th>
            <th>Tijdstip groepsfoto</th>
          </tr>
        </thead>
        <tbody id="meetupBody">
          <tr><td colspan="6" class="status">Meetups laden vanuit planning...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQX1OrMgt__NVJVP0lxrfimr0ihO1jbqWB3u1Oi-6UHlGrjq4KtlwbgnurM6YdkqYiuN8cx7xchteTL/pub?gid=0&single=true&output=csv";

    let allMeetups = [];

    const maanden = {
      jan: 0, january: 0, januari: 0,
      feb: 1, february: 1, februari: 1,
      mar: 2, march: 2, maart: 2,
      apr: 3, april: 3,
      may: 4, mei: 4,
      jun: 5, june: 5, juni: 5,
      jul: 6, july: 6, juli: 6,
      aug: 7, august: 7, augustus: 7,
      sep: 8, september: 8,
      oct: 9, october: 9, oktober: 9,
      nov: 10, november: 10,
      dec: 11, december: 11
    };

    function parseMeetupDate(datumStr) {
      if (!datumStr) return null;
      const clean = datumStr.replace(/\bLocal Time\b/gi, '').trim();

      let m = clean.match(/\b([a-zA-Z]+)\s+(\d{1,2}),?\s+(\d{4})\b/);
      if (m) {
        const month = maanden[m[1].toLowerCase()];
        if (month !== undefined) return new Date(Number(m[3]), month, Number(m[2]));
      }

      m = clean.match(/\b([a-zA-Z]{3})\s+(\d{1,2})\b/);
      if (m) {
        const month = maanden[m[1].toLowerCase()];
        if (month !== undefined) {
          const now = new Date();
          let year = now.getFullYear();
          if (month < now.getMonth() - 2) year += 1;
          return new Date(year, month, Number(m[2]));
        }
      }

      m = clean.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/);
      if (m) {
        return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      }

      return null;
    }

    function isPastMeetup(datumStr) {
      const dateObj = parseMeetupDate(datumStr);
      if (!dateObj || isNaN(dateObj.getTime())) return false;

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dateObj.setHours(0, 0, 0, 0);

      return dateObj < today;
    }

        else if (c === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
        else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());

          row = []; val = '';
